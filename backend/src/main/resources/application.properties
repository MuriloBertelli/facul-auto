server.port=${PORT:8080}
server.max-http-request-header-size=16KB
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.application.name=facul-auto-api
spring.mvc.log-request-details=false
spring.servlet.multipart.enabled=false
facul.supabase-url=${SUPABASE_URL:}
facul.supabase-publishable-key=${SUPABASE_PUBLISHABLE_KEY:}
facul.supabase-owner-user-id=${SUPABASE_OWNER_USER_ID:}
facul.canvas-base-url=${CANVAS_BASE_URL:}
facul.canvas-api-token=${CANVAS_API_TOKEN:}
facul.canvas-submissions-enabled=${CANVAS_SUBMISSIONS_ENABLED:false}
facul.allowed-origins=${APP_ALLOWED_ORIGINS:http://127.0.0.1:8888,http://localhost:8888}
